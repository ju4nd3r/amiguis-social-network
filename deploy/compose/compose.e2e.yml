services:
  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      PORT: 8080
      DATABASE_URL: memory
      JWT_SECRET: e2e-test-jwt-secret
      APP_ENV: test
    ports:
      - "8080:8080"

  web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
