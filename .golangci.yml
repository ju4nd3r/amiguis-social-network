run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - depguard
    - gofmt
    - goimports

linters-settings:
  depguard:
    rules:
      domain_purity:
        files:
          - "**/internal/*/domain/*.go"
          - "!**/internal/*/domain/*_test.go"
        deny:
          - pkg: "github.com/jackc/pgx/v5"
            desc: "Domain layer must only import the Go standard library (Clean Architecture rule)."
          - pkg: "github.com/go-chi/chi/v5"
            desc: "Domain layer must never depend on HTTP routers or transport adapters."
          - pkg: "net/http"
            desc: "Domain layer must never depend on net/http."
